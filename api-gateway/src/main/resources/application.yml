server:
  port: 8080

springdoc:
  swagger-ui:
    urls:
      - name: User Service
        url: /v3/api-docs/user
      - name: Order Service
        url: /v3/api-docs/order
    urls-primary-name: User Service

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      metrics:
        enabled: true
    circuitbreaker:
      resilience4j:
        enableSemaphoreDefaultBulkhead: true
    discovery:
      client:
        simple:
          instances:
            user-service:
              - uri: http://localhost:8081
              - uri: http://localhost:8083

            order-service:
              - uri: http://localhost:8082

  redis:
    host: localhost
    port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: api-gateway
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: true

  rabbitmq:
    host: localhost
    port: 5672
    username: gateway_user
    password: ${RABBITMQ_PASSWORD:local-dev-only-change-me}
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 10s

management:
  metrics:
    tags:
      application: api-gateway
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
    kafka:
      enabled: false
    elasticsearch:
      enabled: false

jwt:
  secret: ${JWT_SECRET:dev-only-change-this-secret-32-bytes}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true

    instances:
      userServiceCircuitBreaker:
        baseConfig: default

      orderServiceCircuitBreaker:
        baseConfig: default


  timelimiter:
    instances:
      userServiceCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      orderServiceCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
